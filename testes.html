<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://lh3.googleusercontent.com; font-src 'self'; connect-src https://dmjoafdbrgtrbpuqunwu.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<title>Restam — testes de segurança</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A14">
<style>
  :root { --fundo:#0E1A14; --cartao:#16241D; --borda:#26382E; --texto:#E8F1EB;
          --fraco:#90A89A; --ok:#37B36B; --mau:#FF6B6B; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:var(--texto);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
       max-width:640px;margin-inline:auto}
  h1{font-size:19px;margin:0 0 2px}
  .sub{color:var(--fraco);font-size:13px;margin:0 0 18px}
  button{font:inherit;font-weight:600;padding:12px 16px;border-radius:12px;
         border:1px solid var(--borda);background:#1E3228;color:var(--texto);width:100%;margin-bottom:16px}
  button[disabled]{opacity:.45}
  #resumo{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:600;display:none}
  .verde{background:#15241C;border:1px solid var(--ok);color:var(--ok)}
  .vermelho{background:#26161A;border:1px solid var(--mau);color:var(--mau)}
  .linha{border:1px solid var(--borda);background:var(--cartao);border-radius:10px;
         padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
  .selo{flex:none;font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;margin-top:1px}
  .selo.p{background:rgba(55,179,107,.15);color:var(--ok)}
  .selo.f{background:rgba(255,107,107,.15);color:var(--mau)}
  .nome{font-weight:600;font-size:14px}
  .det{color:var(--fraco);font-size:12px;margin-top:2px;word-break:break-word}
  .aviso{border-left:3px solid var(--mau);background:#26161A;padding:10px 12px;
         border-radius:8px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<h1>Testes de segurança</h1>
<p class="sub">Corre com a tua sessão. Entra primeiro na app, depois volta aqui.</p>
<button id="correr">Correr testes</button>
<div id="resumo"></div>
<div id="lista"></div>

<script type="module" src="testes.js"></script>
</body>
</html>
