<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Perfil e objetivo — DeficitCalc</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>
  :root {
    --fundo:#0E1A14; --cartao:#16241D; --borda:#26382E; --texto:#E8F1EB;
    --fraco:#90A89A; --acento:#37B36B; --erro:#FF6B6B; --aviso:#E5B84B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--fundo);color:var(--texto);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px);
    max-width:460px;margin-inline:auto}
  header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  header a{color:var(--fraco);text-decoration:none;font-size:15px}
  h1{font-size:20px;margin:0}
  .cartao{background:var(--cartao);border:1px solid var(--borda);border-radius:16px;
    padding:18px 16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--fraco);margin:14px 0 6px}
  label:first-child{margin-top:0}
  input,select{width:100%;font:inherit;padding:11px 12px;border-radius:10px;
    border:1px solid var(--borda);background:#0F1C16;color:var(--texto)}
  input:focus,select:focus{outline:2px solid var(--acento);outline-offset:-1px}
  .dupla{display:flex;gap:10px}
  .dupla>div{flex:1}
  .radios{display:flex;gap:8px}
  .radios button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--borda);
    background:#0F1C16;color:var(--fraco);font:inherit;font-weight:600}
  .radios button[aria-pressed=true]{background:#1E3228;color:var(--texto);border-color:var(--acento)}
  button.principal{width:100%;font:inherit;font-weight:600;padding:14px;border-radius:12px;
    border:1px solid var(--acento);background:#1E3228;color:var(--texto);margin-top:18px}
  button.principal[disabled]{opacity:.45}
  .resultado{text-align:center;padding:4px 0 2px}
  .numero{font-size:34px;font-weight:650;letter-spacing:-1px}
  .numero small{font-size:15px;font-weight:400;color:var(--fraco);letter-spacing:0}
  .intervalo{color:var(--fraco);font-size:13px;margin-top:2px}
  .linha-alvo{display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid var(--borda);margin-top:16px;padding-top:14px}
  .linha-alvo span:last-child{font-size:22px;font-weight:650}
  .nota{font-size:13px;color:var(--fraco);margin-top:12px;line-height:1.5}
  .nota.ajuste{border-left:3px solid var(--aviso);padding-left:10px;color:var(--texto)}
  .vazio{color:var(--fraco);font-size:14px;text-align:center;padding:10px 0}
  #msg{display:none;border-radius:10px;padding:11px 13px;font-size:14px;margin-bottom:14px}
  #msg.erro{border:1px solid var(--erro);background:#26161A;color:var(--erro)}
  #msg.bom{border:1px solid var(--acento);background:#15241C;color:var(--acento)}
  .oculto{display:none!important}
</style>
</head>
<body>

<header>
  <a href="./" aria-label="Voltar">‹ Voltar</a>
  <h1>Perfil e objetivo</h1>
</header>

<div id="msg"></div>

<section class="cartao" id="cartao-gasto">
  <div id="gasto-vazio" class="vazio">Preenche os dados abaixo para veres o teu gasto estimado.</div>
  <div id="gasto-conteudo" class="oculto">
    <div class="resultado">
      <div class="numero" id="g-estimado"></div>
      <div class="intervalo" id="g-intervalo"></div>
    </div>
    <div class="linha-alvo">
      <span>Objetivo diário</span>
      <span id="g-alvo"></span>
    </div>
    <p class="nota" id="g-nota"></p>
    <p class="nota ajuste oculto" id="g-ajuste"></p>
  </div>
</section>

<form class="cartao" id="formulario" autocomplete="off">
  <label>Sexo</label>
  <div class="radios" role="group">
    <button type="button" id="sexo-f" data-v="f" aria-pressed="false">Feminino</button>
    <button type="button" id="sexo-m" data-v="m" aria-pressed="false">Masculino</button>
  </div>

  <div class="dupla">
    <div>
      <label for="nascimento">Data de nascimento</label>
      <input type="date" id="nascimento" required>
    </div>
    <div>
      <label for="altura">Altura (cm)</label>
      <input type="number" id="altura" min="120" max="230" step="1" inputmode="numeric" required>
    </div>
  </div>

  <label for="peso">Peso de hoje (kg)</label>
  <input type="number" id="peso" min="25" max="400" step="0.1" inputmode="decimal" required>

  <label for="atividade">Nível de atividade</label>
  <select id="atividade" required>
    <option value="">Escolhe…</option>
    <option value="sedentario">Sedentário — trabalho sentado, pouco exercício</option>
    <option value="leve">Leve — exercício 1 a 3 vezes por semana</option>
    <option value="moderado">Moderado — exercício 3 a 5 vezes por semana</option>
    <option value="intenso">Intenso — exercício 6 a 7 vezes por semana</option>
    <option value="muito_intenso">Muito intenso — trabalho físico ou treino duas vezes ao dia</option>
  </select>

  <label for="objetivo">Ritmo de perda pretendido</label>
  <select id="objetivo" required>
    <option value="0">Manter o peso</option>
    <option value="0.25">0,25 kg por semana — lento e fácil de manter</option>
    <option value="0.5">0,5 kg por semana — o mais comum</option>
    <option value="0.75">0,75 kg por semana — o máximo que esta app permite</option>
  </select>

  <button type="submit" class="principal" id="guardar">Guardar</button>
</form>

<script type="module">
import { exigirSessao, textoErro } from './sessao.js';

const $ = (id) => document.getElementById(id);
let supabase, perfil, sexoEscolhido = null;

function aviso(texto, tipo) {
  const m = $('msg');
  m.textContent = texto;
  m.className = tipo;
  m.style.display = texto ? 'block' : 'none';
  if (texto) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function marcarSexo(v) {
  sexoEscolhido = v;
  $('sexo-f').setAttribute('aria-pressed', String(v === 'f'));
  $('sexo-m').setAttribute('aria-pressed', String(v === 'm'));
}

async function mostrarGasto() {
  const { data, error } = await supabase.rpc('estimar_gasto');
  const r = Array.isArray(data) ? data[0] : data;
  if (error) { aviso(textoErro(error), 'erro'); return; }
  if (!r || r.gasto_estimado == null) {
    $('gasto-vazio').classList.remove('oculto');
    $('gasto-conteudo').classList.add('oculto');
    return;
  }
  $('gasto-vazio').classList.add('oculto');
  $('gasto-conteudo').classList.remove('oculto');
  $('g-estimado').innerHTML = r.gasto_estimado + ' <small>kcal/dia</small>';
  $('g-intervalo').textContent = `provavelmente entre ${r.gasto_minimo} e ${r.gasto_maximo}`;
  $('g-alvo').textContent = r.kcal_objetivo + ' kcal';
  $('g-nota').textContent =
    'O gasto é uma estimativa a partir da tua altura, peso, idade e atividade. '
    + 'A fórmula erra cerca de 10% para cima ou para baixo conforme a pessoa, '
    + 'por isso trata o intervalo como a resposta e o número do meio como o palpite central.';
  if (r.objetivo_ajustado) {
    $('g-ajuste').textContent = r.motivo + ' O objetivo foi ajustado para ' + r.kcal_objetivo
      + ' kcal, que é o mais baixo que esta app considera razoável para ti.';
    $('g-ajuste').classList.remove('oculto');
  } else {
    $('g-ajuste').classList.add('oculto');
  }
}

async function preencher() {
  if (perfil.sexo) marcarSexo(perfil.sexo);
  if (perfil.data_nascimento) $('nascimento').value = perfil.data_nascimento;
  if (perfil.altura_cm) $('altura').value = perfil.altura_cm;
  if (perfil.nivel_atividade) $('atividade').value = perfil.nivel_atividade;
  if (perfil.objetivo_kg_semana != null) $('objetivo').value = String(Number(perfil.objetivo_kg_semana));

  const { data } = await supabase
    .from('pesos').select('kg, medido_em').order('medido_em', { ascending: false }).limit(1);
  if (data && data[0]) $('peso').value = data[0].kg;

  // A data de nascimento tem limites na base de dados; o ecrã mostra os mesmos.
  const hoje = new Date();
  const anos = (n) => new Date(hoje.getFullYear() - n, hoje.getMonth(), hoje.getDate())
    .toISOString().slice(0, 10);
  $('nascimento').min = anos(100);
  $('nascimento').max = anos(16);
}

async function guardar(ev) {
  ev.preventDefault();
  const btn = $('guardar');
  btn.disabled = true;
  aviso('', '');

  try {
    if (!sexoEscolhido) throw new Error('Escolhe o sexo — a fórmula do gasto precisa dele.');
    const altura = Number($('altura').value);
    const peso = Number($('peso').value);
    const nascimento = $('nascimento').value;
    const atividade = $('atividade').value;
    const objetivo = Number($('objetivo').value);

    if (!nascimento) throw new Error('Falta a data de nascimento.');
    if (!(altura >= 120 && altura <= 230)) throw new Error('A altura tem de estar entre 120 e 230 cm.');
    if (!(peso >= 25 && peso <= 400)) throw new Error('O peso tem de estar entre 25 e 400 kg.');
    if (!atividade) throw new Error('Escolhe o nível de atividade.');

    // Só as colunas que o utilizador pode escrever. As outras nem sequer
    // estão aqui, e a base de dados recusá-las-ia na mesma.
    const { error: e1 } = await supabase.from('profiles').update({
      sexo: sexoEscolhido,
      data_nascimento: nascimento,
      altura_cm: altura,
      nivel_atividade: atividade,
      objetivo_kg_semana: objetivo,
    }).eq('id', (await supabase.auth.getUser()).data.user.id);
    if (e1) throw e1;

    const hoje = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Lisbon' });
    const { error: e2 } = await supabase.from('pesos')
      .upsert({ utilizador_id: (await supabase.auth.getUser()).data.user.id, kg: peso, medido_em: hoje },
              { onConflict: 'utilizador_id,medido_em' });
    if (e2) throw e2;

    aviso('Guardado.', 'bom');
    await mostrarGasto();
  } catch (e) {
    aviso(textoErro(e), 'erro');
  } finally {
    btn.disabled = false;
  }
}

async function principal() {
  const ctx = await exigirSessao();
  supabase = ctx.supabase;
  perfil = ctx.perfil;
  $('sexo-f').addEventListener('click', () => marcarSexo('f'));
  $('sexo-m').addEventListener('click', () => marcarSexo('m'));
  $('formulario').addEventListener('submit', guardar);
  await preencher();
  await mostrarGasto();
}

principal().catch((e) => aviso(textoErro(e), 'erro'));
</script>
</body>
</html>
