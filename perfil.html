<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Perfil e objetivo — Restam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Restam">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<script type="module" src="tema.js"></script>
<style>
  .cartao { padding: 18px 20px; margin-bottom: 12px; }
  .gasto { text-align: center; padding: 6px 0 2px; }
  .gasto .numero { font-size: 44px; line-height: 1; }
  .gasto .numero small { font-size: 15px; color: var(--fraco); font-family: 'IBM Plex Sans', sans-serif; }
  .intervalo { color: var(--fraco); font-size: 13px; margin-top: 4px; }
  .linha-alvo { display: flex; justify-content: space-between; align-items: baseline;
                border-top: 1px solid var(--divisoria); margin-top: 16px; padding-top: 14px; }
  .linha-alvo .valor { font-size: 24px; }
  .nota { font-size: 13px; color: var(--fraco); margin-top: 12px; line-height: 1.5; }
  .nota.ajuste { border-left: 3px solid var(--barra-alta-texto); padding-left: 11px; color: var(--texto); }
  .vazio { color: var(--fraco); font-size: 14px; text-align: center; padding: 12px 0; }
  .radios { display: flex; gap: 8px; }
  .radios button { flex: 1; padding: 12px; border-radius: 14px; border: 1px solid var(--vidro-borda-leve);
                   background: var(--campo); color: var(--fraco); font-weight: 600; }
  .radios button[aria-pressed="true"] { background: var(--acento-suave); color: var(--acento-texto); border-color: var(--acento); }
  .dupla { display: flex; gap: 10px; }
  .dupla > div { flex: 1; }
</style>
</head>
<body>

<div class="topo">
  <div style="display:flex;align-items:center;gap:12px">
    <a href="hoje.html" class="redondo toque" aria-label="Voltar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1>Perfil e objetivo</h1>
  </div>
  <button class="redondo toque" id="btn-tema"></button>
</div>

<div id="msg" class="aviso oculto"></div>

<section class="vidro cartao" id="cartao-gasto">
  <div id="gasto-vazio" class="vazio">Preenche os dados abaixo para veres o teu gasto estimado.</div>
  <div id="gasto-conteudo" class="oculto">
    <div class="gasto">
      <div class="num numero" id="g-estimado"></div>
      <div class="intervalo" id="g-intervalo"></div>
    </div>
    <div class="linha-alvo">
      <span>Objetivo diário</span>
      <span class="num valor" id="g-alvo"></span>
    </div>
    <p class="nota" id="g-nota"></p>
    <p class="nota ajuste oculto" id="g-ajuste"></p>
  </div>
</section>

<form class="vidro cartao" id="formulario" autocomplete="off">
  <label>Sexo</label>
  <div class="radios" role="group">
    <button type="button" class="toque" id="sexo-f" aria-pressed="false">Feminino</button>
    <button type="button" class="toque" id="sexo-m" aria-pressed="false">Masculino</button>
  </div>

  <div class="dupla">
    <div>
      <label for="nascimento">Data de nascimento</label>
      <input type="date" id="nascimento" required>
    </div>
    <div>
      <label for="altura">Altura (cm)</label>
      <input type="number" id="altura" min="120" max="230" step="1" inputmode="numeric" required>
    </div>
  </div>

  <label for="peso">Peso de hoje (kg)</label>
  <input type="number" id="peso" min="25" max="400" step="0.1" inputmode="decimal" required>

  <label for="atividade">Nível de atividade</label>
  <select id="atividade" required>
    <option value="">Escolhe…</option>
    <option value="sedentario">Sedentário — trabalho sentado, pouco exercício</option>
    <option value="leve">Leve — exercício 1 a 3 vezes por semana</option>
    <option value="moderado">Moderado — exercício 3 a 5 vezes por semana</option>
    <option value="intenso">Intenso — exercício 6 a 7 vezes por semana</option>
    <option value="muito_intenso">Muito intenso — trabalho físico ou treino duas vezes ao dia</option>
  </select>

  <label for="objetivo">Ritmo de perda pretendido</label>
  <select id="objetivo" required>
    <option value="0">Manter o peso</option>
    <option value="0.25">0,25 kg por semana — lento e fácil de manter</option>
    <option value="0.5">0,5 kg por semana — o mais comum</option>
    <option value="0.75">0,75 kg por semana — o máximo que esta app permite</option>
  </select>

  <button type="submit" class="principal toque" id="guardar">Guardar</button>
</form>

<nav class="vidro nav">
  <a href="hoje.html">Hoje</a>
  <a href="perfil.html" aria-current="page">Perfil</a>
</nav>

<script type="module">
import { exigirSessao, textoErro } from './sessao.js';
import { alternarTema, desenharIconeTema, aplicarTema } from './tema.js';

const $ = (id) => document.getElementById(id);
let supabase, perfil, eu, sexoEscolhido = null;

function aviso(texto, tipo) {
  const m = $('msg');
  m.textContent = texto || '';
  m.className = 'aviso ' + (tipo || '');
  m.classList.toggle('oculto', !texto);
  if (texto) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function marcarSexo(v) {
  sexoEscolhido = v;
  $('sexo-f').setAttribute('aria-pressed', String(v === 'f'));
  $('sexo-m').setAttribute('aria-pressed', String(v === 'm'));
}

async function mostrarGasto() {
  const { data, error } = await supabase.rpc('estimar_gasto');
  const r = Array.isArray(data) ? data[0] : data;
  if (error) { aviso(textoErro(error), 'erro'); return; }
  if (!r || r.gasto_estimado == null) {
    $('gasto-vazio').classList.remove('oculto');
    $('gasto-conteudo').classList.add('oculto');
    return;
  }
  $('gasto-vazio').classList.add('oculto');
  $('gasto-conteudo').classList.remove('oculto');
  $('g-estimado').innerHTML = r.gasto_estimado + ' <small>kcal/dia</small>';
  $('g-intervalo').textContent = `provavelmente entre ${r.gasto_minimo} e ${r.gasto_maximo}`;
  $('g-alvo').textContent = r.kcal_objetivo + ' kcal';
  $('g-nota').textContent =
    'O gasto é uma estimativa a partir da tua altura, peso, idade e atividade. '
    + 'A fórmula erra cerca de 10% para cima ou para baixo conforme a pessoa, por isso trata o '
    + 'intervalo como a resposta e o número do meio como o palpite central.';
  if (r.objetivo_ajustado) {
    $('g-ajuste').textContent = r.motivo + ' O objetivo foi ajustado para ' + r.kcal_objetivo
      + ' kcal, que é o mais baixo que esta app considera razoável para ti.';
    $('g-ajuste').classList.remove('oculto');
  } else {
    $('g-ajuste').classList.add('oculto');
  }
}

async function preencher() {
  if (perfil.sexo) marcarSexo(perfil.sexo);
  if (perfil.data_nascimento) $('nascimento').value = perfil.data_nascimento;
  if (perfil.altura_cm) $('altura').value = perfil.altura_cm;
  if (perfil.nivel_atividade) $('atividade').value = perfil.nivel_atividade;
  if (perfil.objetivo_kg_semana != null) $('objetivo').value = String(Number(perfil.objetivo_kg_semana));

  const { data } = await supabase.from('pesos')
    .select('kg, medido_em').order('medido_em', { ascending: false }).limit(1);
  if (data && data[0]) $('peso').value = data[0].kg;

  const hoje = new Date();
  const anos = (n) => new Date(hoje.getFullYear() - n, hoje.getMonth(), hoje.getDate())
    .toISOString().slice(0, 10);
  $('nascimento').min = anos(100);
  $('nascimento').max = anos(16);
}

async function guardar(ev) {
  ev.preventDefault();
  const btn = $('guardar');
  btn.disabled = true;
  aviso('', '');

  try {
    if (!sexoEscolhido) throw new Error('Escolhe o sexo — a fórmula do gasto precisa dele.');
    const altura = Number($('altura').value);
    const peso = Number($('peso').value);
    const nascimento = $('nascimento').value;
    const atividade = $('atividade').value;
    const objetivo = Number($('objetivo').value);

    if (!nascimento) throw new Error('Falta a data de nascimento.');
    if (!(altura >= 120 && altura <= 230)) throw new Error('A altura tem de estar entre 120 e 230 cm.');
    if (!(peso >= 25 && peso <= 400)) throw new Error('O peso tem de estar entre 25 e 400 kg.');
    if (!atividade) throw new Error('Escolhe o nível de atividade.');

    // Só as colunas que o utilizador pode escrever. As outras nem sequer vão
    // aqui, e a base de dados recusá-las-ia na mesma.
    const { error: e1 } = await supabase.from('profiles').update({
      sexo: sexoEscolhido,
      data_nascimento: nascimento,
      altura_cm: altura,
      nivel_atividade: atividade,
      objetivo_kg_semana: objetivo,
    }).eq('id', eu);
    if (e1) throw e1;

    const hoje = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Lisbon' });
    const { error: e2 } = await supabase.from('pesos')
      .upsert({ utilizador_id: eu, kg: peso, medido_em: hoje },
              { onConflict: 'utilizador_id,medido_em' });
    if (e2) throw e2;

    aviso('Guardado.', 'bom');
    await mostrarGasto();
  } catch (e) {
    aviso(textoErro(e), 'erro');
  } finally {
    btn.disabled = false;
  }
}

async function principal() {
  const ctx = await exigirSessao();
  supabase = ctx.supabase;
  perfil = ctx.perfil;
  eu = ctx.sessao.user.id;

  desenharIconeTema($('btn-tema'));
  $('btn-tema').addEventListener('click', () => {
    alternarTema();
    desenharIconeTema($('btn-tema'));
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    aplicarTema();
    desenharIconeTema($('btn-tema'));
  });

  $('sexo-f').addEventListener('click', () => marcarSexo('f'));
  $('sexo-m').addEventListener('click', () => marcarSexo('m'));
  $('formulario').addEventListener('submit', guardar);
  await preencher();
  await mostrarGasto();
}

principal().catch((e) => aviso(textoErro(e), 'erro'));
</script>
</body>
</html>
