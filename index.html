<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>DeficitCalc</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A14">
<meta name="color-scheme" content="dark light">

<!-- Instalação no ecrã principal do iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeficitCalc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root {
    --fundo: #0E1A14;
    --cartao: #16241D;
    --borda: #26382E;
    --texto: #E8F1EB;
    --texto-fraco: #90A89A;
    --acento: #37B36B;
    --erro: #FF6B6B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
    gap: 16px;
  }
  .cartao {
    width: 100%;
    max-width: 380px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 18px;
    padding: 24px 20px;
    text-align: center;
  }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.3px; }
  .sub { color: var(--texto-fraco); font-size: 14px; margin: 0 0 20px; }
  button {
    width: 100%;
    font: inherit;
    font-weight: 600;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--borda);
    background: #1E3228;
    color: var(--texto);
    cursor: pointer;
  }
  button:active { opacity: .7; }
  button[disabled] { opacity: .45; }
  #btn-entrar { background: #fff; color: #1a1a1a; border-color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
  #btn-entrar svg { width: 18px; height: 18px; flex: none; }
  .manter { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; color: var(--texto-fraco); font-size: 14px; }
  .manter input { width: 18px; height: 18px; accent-color: var(--acento); }
  .avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 12px; display: block; background: #23372C; object-fit: cover; }
  .nome { font-size: 20px; font-weight: 650; margin: 0; }
  .email { color: var(--texto-fraco); font-size: 14px; margin: 2px 0 20px; word-break: break-all; }
  .aviso { border-left: 3px solid var(--acento); background: #15241C; color: var(--texto-fraco); font-size: 13px; text-align: left; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; }
  #erro { display: none; width: 100%; max-width: 380px; border: 1px solid var(--erro); color: var(--erro); background: #26161A; border-radius: 12px; padding: 12px 14px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  #diag { width: 100%; max-width: 380px; color: var(--texto-fraco); font-size: 12px; line-height: 1.7; border: 1px dashed var(--borda); border-radius: 12px; padding: 12px 14px; }
  #diag b { color: var(--texto); font-weight: 600; }
  .botao-ligacao { display:block; width:100%; font-weight:600; padding:14px 16px;
    border-radius:12px; border:1px solid var(--acento); background:#1E3228;
    color:var(--texto); text-decoration:none; margin-bottom:16px; }
  .oculto { display: none !important; }
</style>
</head>
<body>

<div id="erro"></div>

<main class="cartao" id="cartao">
  <p class="sub" id="estado">A carregar…</p>
</main>

<section id="diag" class="oculto"></section>

<!-- Modelos de ecrã -->
<template id="t-entrada">
  <h1>DeficitCalc</h1>
  <p class="sub">Entra para registares o teu dia.</p>
  <button id="btn-entrar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.4-.4-2.4s.1-1.6.4-2.4V6.5H1.4C.5 8.2 0 10 0 12s.5 3.8 1.4 5.5l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.5l4 3.1C6.3 6.8 8.9 4.8 12 4.8z"/></svg>
    Entrar com Google
  </button>
  <label class="manter">
    <input type="checkbox" id="chk-manter" checked>
    Manter sessão iniciada
  </label>
</template>

<template id="t-espera">
  <img class="avatar" id="avatar" alt="">
  <p class="nome" id="nome"></p>
  <p class="email" id="email"></p>
  <div class="aviso" id="espera-texto"></div>
  <button id="btn-sair">Sair</button>
</template>

<template id="t-dentro">
  <img class="avatar" id="avatar" alt="">
  <p class="nome" id="nome"></p>
  <p class="email" id="email"></p>
  <a class="botao-ligacao" href="perfil.html">Perfil e objetivo</a>
  <div class="aviso" id="validade"></div>
  <button id="btn-sair">Sair</button>
</template>


<script type="module">
import { CONFIG } from './config.js';

const DIA = 86400000;
const K_INICIO = 'dc.sessao.inicio';   // timestamp do login (limite absoluto)
const K_VISTO  = 'dc.sessao.visto';    // timestamp da última abertura (inatividade)
const K_MANTER = 'dc.sessao.manter';   // '1' ou '0', fica sempre em localStorage

const $ = (id) => document.getElementById(id);
const cartao = $('cartao');

let supabase = null;       // preenchido em principal()
let origemBiblioteca = ''; // qual CDN respondeu
let manterSessao = localStorage.getItem(K_MANTER) !== '0';
let store = manterSessao ? localStorage : sessionStorage;

// ---------- Erros visíveis no ecrã (não há consola no iPhone) ----------
function textoErro(e) {
  if (!e) return 'Erro desconhecido.';
  if (typeof e === 'string') {
    return e === 'Script error.'
      ? 'Script error. (erro vindo de código externo; o detalhe foi escondido pelo browser)'
      : e;
  }
  const partes = [];
  if (e.name) partes.push(e.name);
  if (e.message) partes.push(e.message);
  if (e.status) partes.push('estado HTTP ' + e.status);
  return partes.length ? partes.join(': ') : String(e);
}

function mostrarErro(e) {
  const cx = $('erro');
  cx.style.display = 'block';
  cx.textContent = (cx.textContent ? cx.textContent + '\n\n' : '') + textoErro(e);
}

window.addEventListener('error', (ev) => mostrarErro(ev.error || ev.message));
window.addEventListener('unhandledrejection', (ev) => mostrarErro(ev.reason));

// ---------- Datas ----------
function dataPT(ms) {
  return new Date(ms).toLocaleString('pt-PT', {
    timeZone: 'Europe/Lisbon', day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });
}

// ---------- Regra de sessão: 30 dias renovados, máximo absoluto 60 ----------
function limiteUltrapassado() {
  const agora = Date.now();
  const inicio = Number(store.getItem(K_INICIO) || 0);
  const visto = Number(store.getItem(K_VISTO) || 0);
  if (inicio && agora - inicio > CONFIG.SESSAO_DIAS_MAXIMO * DIA) return 'maximo';
  if (visto && agora - visto > CONFIG.SESSAO_DIAS_INATIVIDADE * DIA) return 'inatividade';
  return null;
}

// Os "code verifier" de logins anteriores ficam para trás em localStorage.
// São segredos de curta duração; não há razão para os manter depois de a
// sessão estar criada.
function limparVerifiersAntigos(exceto) {
  for (const k of Object.keys(localStorage)) {
    if (k.includes('code-verifier') && k !== exceto) localStorage.removeItem(k);
  }
}

function marcarAbertura(novoLogin) {
  const agora = Date.now();
  if (novoLogin || !store.getItem(K_INICIO)) store.setItem(K_INICIO, String(agora));
  store.setItem(K_VISTO, String(agora));
}

function limparMarcas() {
  store.removeItem(K_INICIO);
  store.removeItem(K_VISTO);
}

// ---------- Ecrãs ----------
function ecra(idTemplate) {
  cartao.replaceChildren($(idTemplate).content.cloneNode(true));
}

function mostrarEntrada(mensagem, desativado) {
  ecra('t-entrada');
  $('chk-manter').checked = manterSessao;
  if (mensagem) {
    const p = document.createElement('p');
    p.className = 'sub';
    p.style.marginTop = '14px';
    p.textContent = mensagem;
    cartao.append(p);
  }
  if (desativado) {
    $('btn-entrar').disabled = true;
  } else {
    $('btn-entrar').addEventListener('click', entrar);
  }
  $('chk-manter').addEventListener('change', (ev) => {
    localStorage.setItem(K_MANTER, ev.target.checked ? '1' : '0');
  });
}

// O ecra de espera e' cortesia, nao e' seguranca: quem manda e' a RLS nas
// tabelas de dados. Por isso, se a leitura falhar (tabela ou coluna ainda nao
// criadas), deixamos passar e anotamos no diagnostico, em vez de trancar o
// utilizador a' porta por causa de um erro de configuracao.
let estadoPerfil = { lido: false };

async function lerPerfil() {
  try {
    const { data, error } = await supabase
      .from('profiles')
      .select('nome, aprovado')
      .maybeSingle();
    if (error) return { lido: false, motivo: error.message };
    if (!data)  return { lido: false, motivo: 'sem linha em profiles' };
    return { lido: true, aprovado: data.aprovado === true, nome: data.nome };
  } catch (e) {
    return { lido: false, motivo: (e && e.message) ? e.message : String(e) };
  }
}

async function entrarNaApp(user, session) {
  estadoPerfil = await lerPerfil();
  if (estadoPerfil.lido && !estadoPerfil.aprovado) mostrarEspera(user);
  else mostrarDentro(user);
  diagnostico(session);
}

function cabecalhoPessoa(user) {
  const m = user.user_metadata || {};
  $('nome').textContent = m.full_name || m.name || (user.email || '').split('@')[0];
  $('email').textContent = user.email || '';
  const foto = m.avatar_url || m.picture;
  if (foto) $('avatar').src = foto; else $('avatar').remove();
}

function mostrarEspera(user) {
  ecra('t-espera');
  cabecalhoPessoa(user);
  $('espera-texto').textContent =
    'A tua conta ainda não foi autorizada. Entraste com o Google, mas falta alguém '
    + 'dar-te acesso à app. Quando isso acontecer, é só voltar a abrir — não precisas '
    + 'de entrar outra vez.';
  $('btn-sair').addEventListener('click', sair);
}

function mostrarDentro(user) {
  ecra('t-dentro');
  cabecalhoPessoa(user);

  const inicio = Number(store.getItem(K_INICIO) || Date.now());
  const fimInatividade = Date.now() + CONFIG.SESSAO_DIAS_INATIVIDADE * DIA;
  const fimAbsoluto = inicio + CONFIG.SESSAO_DIAS_MAXIMO * DIA;
  const fim = Math.min(fimInatividade, fimAbsoluto);
  $('validade').textContent =
    `Sessão válida até ${dataPT(fim)}. Renova-se sempre que abres a app, até ao limite de ${CONFIG.SESSAO_DIAS_MAXIMO} dias (${dataPT(fimAbsoluto)}).`;

  $('btn-sair').addEventListener('click', sair);
}

// ---------- Ações ----------
async function entrar() {
  const btn = $('btn-entrar');
  btn.disabled = true;
  try {
    localStorage.setItem(K_MANTER, $('chk-manter').checked ? '1' : '0');
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: CONFIG.REDIRECT_TO,
        queryParams: { prompt: 'select_account' },
      },
    });
    if (error) throw error;
    // Se em 4 segundos não saímos da página, algo bloqueou o reencaminhamento.
    setTimeout(() => {
      if (!document.hidden) {
        btn.disabled = false;
        mostrarErro('O reencaminhamento para o Google não aconteceu. '
          + 'Confirma no Supabase que ' + CONFIG.REDIRECT_TO + ' está em Redirect URLs.');
      }
    }, 4000);
  } catch (e) {
    btn.disabled = false;
    mostrarErro(e);
  }
}

async function sair() {
  $('btn-sair').disabled = true;
  try {
    await supabase.auth.signOut();
  } catch (e) {
    mostrarErro(e);
  }
  limparMarcas();
  limparVerifiersAntigos();
  mostrarEntrada();
  diagnostico(null);
}

// ---------- Diagnóstico ----------
function modoApresentacao() {
  if (window.navigator.standalone === true) return 'instalada (iOS)';
  if (window.matchMedia('(display-mode: standalone)').matches) return 'instalada';
  return 'browser';
}

function diagnostico(session) {
  const d = $('diag');
  if (!CONFIG.DEBUG) { d.classList.add('oculto'); return; }
  d.classList.remove('oculto');
  const inicio = Number(store.getItem(K_INICIO) || 0);
  const visto = Number(store.getItem(K_VISTO) || 0);
  const chave = (CONFIG.SUPABASE_PUBLISHABLE_KEY || '').trim();
  d.innerHTML = [
    `<b>Modo:</b> ${modoApresentacao()}`,
    `<b>Fluxo:</b> ${CONFIG.FLOW_TYPE}`,
    `<b>Armazenamento:</b> ${manterSessao ? 'localStorage' : 'sessionStorage'}`,
    `<b>Chave:</b> ${chave.slice(0, 15)}… (${chave.length} caracteres)`,
    `<b>Biblioteca:</b> ${origemBiblioteca ? origemBiblioteca.replace('https://cdn.jsdelivr.net/npm/', '') : 'não carregada'}`,
    `<b>Sessão Supabase:</b> ${session ? 'ativa' : 'nenhuma'}`,
    session ? `<b>Perfil:</b> ${estadoPerfil.lido ? (estadoPerfil.aprovado ? 'aprovado' : 'à espera') : 'não lido (' + (estadoPerfil.motivo || '?') + ')'}` : '',
    session ? `<b>Token expira:</b> ${dataPT(session.expires_at * 1000)}` : '',
    inicio ? `<b>Login em:</b> ${dataPT(inicio)}` : '',
    visto ? `<b>Última abertura:</b> ${dataPT(visto)}` : '',
  ].filter(Boolean).join('<br>');
}

// ---------- Carregamento da biblioteca ----------
// Versão fixa primeiro (previsível), alternativas a seguir (resistente a falhas
// de CDN). Importar assim, e não com import estático, permite dizer no ecrã
// que foi o carregamento que falhou em vez de deixar a página em branco.
const FONTES = [
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/+esm',
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm',
  'https://esm.sh/@supabase/supabase-js@2.112.4',
];

async function carregarBiblioteca() {
  let ultimo = null;
  for (const url of FONTES) {
    try {
      const mod = await import(url);
      if (mod && mod.createClient) { origemBiblioteca = url; return mod.createClient; }
    } catch (e) { ultimo = e; }
  }
  throw new Error('Não foi possível carregar a biblioteca do Supabase de nenhuma origem. '
    + 'Verifica a ligação à internet. Último erro: ' + textoErro(ultimo));
}

// ---------- Arranque ----------
async function principal() {
  // 1. A chave tem de estar preenchida. Sem isto, tudo o resto falha de forma
  //    confusa: o botão fica sem efeito e o erro que aparece não diz porquê.
  const chave = (CONFIG.SUPABASE_PUBLISHABLE_KEY || '').trim();
  const chaveOk = /^sb_publishable_[A-Za-z0-9_-]{10,}$/.test(chave)
               || /^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(chave);
  if (!chaveOk) {
    mostrarErro('Falta a chave publicável. Abre o config.js e substitui o valor de '
      + 'SUPABASE_PUBLISHABLE_KEY pela chave do painel do Supabase '
      + '(Settings → API Keys), que começa por sb_publishable_. '
      + 'Valor atual: "' + (chave.slice(0, 20) || '(vazio)') + '…"');
    mostrarEntrada('Configuração incompleta.', true);
    diagnostico(null);
    return;
  }

  // 2. Biblioteca
  const createClient = await carregarBiblioteca();

  // 3. O "code verifier" do PKCE é escrito antes de sair para o Google e lido no
  //    regresso. Se a caixa "manter sessão" mudar nesse intervalo, o
  //    armazenamento mudava e o verifier desaparecia. Por isso o verifier fica
  //    sempre em localStorage; só a sessão respeita a escolha.
  const ehVerifier = (k) => String(k).includes('code-verifier');
  const armazenamento = {
    getItem: (k) => (ehVerifier(k) ? localStorage : store).getItem(k),
    setItem: (k, v) => (ehVerifier(k) ? localStorage : store).setItem(k, v),
    removeItem: (k) => (ehVerifier(k) ? localStorage : store).removeItem(k),
  };

  supabase = createClient(CONFIG.SUPABASE_URL, chave, {
    auth: {
      flowType: CONFIG.FLOW_TYPE,
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
      storage: armazenamento,
      storageKey: 'dc.auth',
    },
  });

  supabase.auth.onAuthStateChange(async (evento, session) => {
    if (evento === 'SIGNED_IN' && session) {
      limparVerifiersAntigos();
      marcarAbertura(!store.getItem(K_INICIO));
      entrarNaApp(session.user, session).catch(mostrarErro);
    }
    if (evento === 'SIGNED_OUT') {
      mostrarEntrada();
      diagnostico(null);
    }
  });

  // 4. Erro devolvido pelo Google / Supabase no URL
  const params = new URLSearchParams(location.search || location.hash.replace('#', '?'));
  const erroUrl = params.get('error_description') || params.get('error');
  if (erroUrl) mostrarErro('Erro de autenticação: ' + erroUrl);

  // Regresso do Google: conta como login novo e reinicia o limite de 60 dias.
  const veioDoLogin = /[?#].*(code=|access_token=)/.test(location.href);

  const { data, error } = await supabase.auth.getSession();
  if (error) mostrarErro(error);
  const session = data?.session || null;

  // Limpa o URL depois do regresso do Google
  if (location.search || location.hash) {
    history.replaceState({}, '', location.pathname);
  }

  if (session) {
    if (veioDoLogin) {
      limparVerifiersAntigos();
      marcarAbertura(true);
      await entrarNaApp(session.user, session);
      return;
    }
    const limite = limiteUltrapassado();
    if (limite) {
      await supabase.auth.signOut();
      limparMarcas();
      mostrarEntrada(limite === 'maximo'
        ? 'A sessão atingiu o limite de 60 dias. Entra outra vez.'
        : 'A sessão esteve mais de 30 dias sem uso. Entra outra vez.');
      diagnostico(null);
      return;
    }
    marcarAbertura(false);
    await entrarNaApp(session.user, session);
    return;
  }
  mostrarEntrada();
  diagnostico(session);
}

principal().catch((e) => {
  mostrarErro(e);
  try { mostrarEntrada('Não foi possível arrancar.', true); diagnostico(null); } catch (_) {}
});
</script>
</body>
</html>
