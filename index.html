<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://lh3.googleusercontent.com; font-src 'self'; connect-src https://dmjoafdbrgtrbpuqunwu.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<title>Restam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060A">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Restam">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fontes.css">
<link rel="stylesheet" href="estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"
        integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="tema.js"></script>
<style>
  body { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
  .cartao { padding: 26px 22px; text-align: center; }
  h1 { font-size: 23px; margin: 0 0 4px; letter-spacing: -0.3px; }
  .sub { color: var(--fraco); font-size: 14px; margin: 0 0 22px; }
  #btn-entrar { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
                background: #FFFFFF; color: #1A1A1A; font-weight: 600; padding: 15px;
                border-radius: 16px; border: 1px solid rgba(0,0,0,0.08); }
  #btn-entrar svg { width: 18px; height: 18px; flex: none; }
  .manter { display: flex; align-items: center; justify-content: center; gap: 9px;
            margin-top: 16px; color: var(--fraco); font-size: 14px; }
  .manter input { width: 19px; height: 19px; accent-color: var(--acento); }
  .avatar { width: 74px; height: 74px; border-radius: 50%; margin: 0 auto 12px; display: block;
            background: var(--campo); object-fit: cover; }
  .nome { font-size: 20px; font-weight: 600; margin: 0; }
  .email { color: var(--fraco); font-size: 14px; margin: 2px 0 20px; word-break: break-all; }
  .nota { border-left: 3px solid var(--acento); background: var(--acento-suave); color: var(--texto);
          font-size: 13px; text-align: left; padding: 11px 13px; border-radius: 10px; margin-bottom: 18px; }
  #diag { color: var(--fraco); font-size: 12px; line-height: 1.7; border: 1px dashed var(--vidro-borda);
          border-radius: 14px; padding: 12px 14px; margin-top: 14px; }
  #diag b { color: var(--texto); font-weight: 600; }
</style>
</head>
<body>

<div id="erro" class="aviso erro oculto"></div>

<main class="vidro cartao" id="cartao">
  <p class="sub" id="estado">A carregar…</p>
</main>

<section id="diag" class="oculto"></section>

<template id="t-entrada">
  <h1>Restam</h1>
  <p class="sub">Entra para registares o teu dia.</p>
  <button id="btn-entrar" class="toque">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.4-.4-2.4s.1-1.6.4-2.4V6.5H1.4C.5 8.2 0 10 0 12s.5 3.8 1.4 5.5l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.5l4 3.1C6.3 6.8 8.9 4.8 12 4.8z"/></svg>
    Entrar com Google
  </button>
  <label class="manter">
    <input type="checkbox" id="chk-manter" checked>
    Manter sessão iniciada
  </label>
</template>

<template id="t-espera">
  <img class="avatar" id="avatar" alt="">
  <p class="nome" id="nome"></p>
  <p class="email" id="email"></p>
  <div class="nota" id="espera-texto"></div>
  <button id="btn-sair" class="principal toque">Sair</button>
</template>

<script type="module" src="index.js"></script>
</body>
</html>
