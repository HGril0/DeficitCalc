<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://lh3.googleusercontent.com; font-src 'self'; connect-src https://dmjoafdbrgtrbpuqunwu.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<title>Hoje — Restam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Restam">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="fontes.css">
<link rel="stylesheet" href="estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"
        integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="tema.js"></script>
<style>
  .cartao-topo { padding: 18px 20px; display: flex; gap: 20px; align-items: flex-end; }
  .restam { font-size: 62px; line-height: 0.92; margin-top: 2px; transition: color .3s ease; }
  .resumo { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) auto; row-gap: 5px; align-items: baseline; padding-bottom: 4px; }
  .resumo span:nth-child(odd) { font-size: 11px; color: var(--fraco); }
  .resumo span:nth-child(even) { font-size: 18px; text-align: right; }

  .grafico { margin-top: 12px; padding: 16px 18px 14px; }
  .barras { position: relative; display: flex; align-items: flex-end; gap: 10px; height: 102px; }
  .linha-objetivo { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--tracejado); }
  .barras button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 0; }
  .barras .valor { font-size: 9px; font-family: 'IBM Plex Mono', monospace; color: var(--fraco); }
  .barras .haste { width: 100%; border-radius: 7px 7px 3px 3px; background: var(--barra);
                   transition: height .4s cubic-bezier(.2,.8,.2,1), background .3s ease; }
  .dias { display: flex; gap: 10px; margin-top: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--fraco); text-align: center; }
  .dias span { flex: 1; }

  .refeicoes { margin-top: 12px; overflow: hidden; }
  .refeicoes .nome { font-size: 15px; }
  .refeicoes .kcal { font-size: 19px; }
  .refeicoes .sub { font-size: 12px; color: var(--fraco); margin-top: 1px; }
  .saltada .nome, .saltada .kcal { color: var(--fraco); font-style: italic; }

  .opcao { width: 100%; display: flex; justify-content: space-between; align-items: baseline;
           padding: 14px 16px; margin-bottom: 8px; border-radius: 16px;
           background: var(--campo); border: 1px solid var(--vidro-borda-leve); text-align: left; }
  .itens { margin: 10px 0 0; padding: 0; list-style: none; }
  .itens li { display: flex; justify-content: space-between; align-items: center; gap: 10px;
              padding: 9px 0; border-top: 1px solid var(--divisoria); font-size: 14px; }
  .apagar { font-size: 12px; color: var(--acento); text-decoration: underline; min-height: 0; }
  .dupla { display: flex; gap: 10px; }
  .dupla > div { flex: 1; }
  .dupla > div:last-child { flex: 0 0 110px; }
  .carregar { text-align: center; color: var(--fraco); padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>

<div class="topo">
  <div>
    <div class="data" id="data"></div>
    <div class="mono" style="font-size:10px;letter-spacing:.06em;color:var(--fraco);margin-top:1px" id="semana"></div>
  </div>
  <button class="redondo flutua toque" id="btn-tema"></button>
</div>

<div id="msg" class="aviso oculto"></div>

<div id="conteudo" class="oculto">

  <section class="vidro cartao-topo">
    <div>
      <div class="etiqueta">RESTAM</div>
      <div class="num restam" id="restam">—</div>
    </div>
    <div class="resumo">
      <span>Comido</span><span class="num" id="comido">—</span>
      <span>Objetivo</span><span class="num" id="objetivo">—</span>
      <span>Défice da semana</span><span class="num" id="defice">—</span>
    </div>
  </section>

  <section class="vidro-leve grafico">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;min-height:16px;gap:10px">
      <span class="etiqueta" id="titulo-grafico">ÚLTIMOS 7 DIAS</span>
      <span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fraco)" id="legenda-objetivo"></span>
    </div>
    <div class="barras" id="barras"></div>
    <div class="dias" id="dias"></div>
  </section>

  <section class="vidro refeicoes">
    <div class="lista" id="refeicoes"></div>
  </section>

  <nav class="vidro flutua nav">
    <a href="hoje.html" aria-current="page">Hoje</a>
    <a href="receitas.html">Receitas</a>
    <a href="perfil.html">Perfil</a>
  </nav>

</div>

<div class="carregar" id="carregar">A carregar…</div>

<!-- folha de registo -->
<button class="veu oculto" id="veu" aria-label="Fechar"></button>
<div class="folha oculto" id="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
  <div class="puxador"></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <h2 id="folha-titulo" style="font-size:18px;font-weight:600;margin:0"></h2>
    <button class="toque" id="fechar" style="font-size:14px;color:var(--fraco)">Fechar</button>
  </div>
  <p id="folha-sub" style="font-size:12px;color:var(--fraco);margin:3px 0 14px"></p>

  <ul class="itens" id="itens"></ul>

  <div id="pesquisa-raiz"></div>

  <form id="form-item" autocomplete="off">
    <div class="dupla">
      <div>
        <label for="descricao">O que comeste</label>
        <input type="text" id="descricao" maxlength="80" placeholder="Massa com atum">
      </div>
      <div>
        <label for="kcal">kcal</label>
        <input type="number" id="kcal" min="0" max="5000" step="1" inputmode="numeric" required>
      </div>
    </div>
    <button type="submit" class="principal toque" id="guardar">Acrescentar</button>
  </form>

  <button class="toque" id="nao-comi" style="width:100%;margin-top:10px;padding:13px;border-radius:16px;border:1px solid var(--vidro-borda-leve);background:var(--campo);font-size:14px;color:var(--fraco)">Não comi esta refeição</button>
</div>

<script type="module" src="hoje.js"></script>
</body>
</html>
