<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Hoje — Restam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Restam">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<script type="module" src="tema.js"></script>
<style>
  .cartao-topo { padding: 18px 20px; display: flex; gap: 20px; align-items: flex-end; }
  .restam { font-size: 62px; line-height: 0.92; margin-top: 2px; transition: color .3s ease; }
  .resumo { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) auto; row-gap: 5px; align-items: baseline; padding-bottom: 4px; }
  .resumo span:nth-child(odd) { font-size: 11px; color: var(--fraco); }
  .resumo span:nth-child(even) { font-size: 18px; text-align: right; }

  .grafico { margin-top: 12px; padding: 16px 18px 14px; }
  .barras { position: relative; display: flex; align-items: flex-end; gap: 10px; height: 102px; }
  .linha-objetivo { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--tracejado); }
  .barras button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 0; }
  .barras .valor { font-size: 9px; font-family: 'IBM Plex Mono', monospace; color: var(--fraco); }
  .barras .haste { width: 100%; border-radius: 7px 7px 3px 3px; background: var(--barra);
                   transition: height .4s cubic-bezier(.2,.8,.2,1), background .3s ease; }
  .dias { display: flex; gap: 10px; margin-top: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--fraco); text-align: center; }
  .dias span { flex: 1; }

  .refeicoes { margin-top: 12px; overflow: hidden; }
  .refeicoes .nome { font-size: 15px; }
  .refeicoes .kcal { font-size: 19px; }
  .refeicoes .sub { font-size: 12px; color: var(--fraco); margin-top: 1px; }
  .saltada .nome, .saltada .kcal { color: var(--fraco); font-style: italic; }

  .opcao { width: 100%; display: flex; justify-content: space-between; align-items: baseline;
           padding: 14px 16px; margin-bottom: 8px; border-radius: 16px;
           background: var(--campo); border: 1px solid var(--vidro-borda-leve); text-align: left; }
  .itens { margin: 10px 0 0; padding: 0; list-style: none; }
  .itens li { display: flex; justify-content: space-between; align-items: center; gap: 10px;
              padding: 9px 0; border-top: 1px solid var(--divisoria); font-size: 14px; }
  .apagar { font-size: 12px; color: var(--acento); text-decoration: underline; min-height: 0; }
  .dupla { display: flex; gap: 10px; }
  .dupla > div { flex: 1; }
  .dupla > div:last-child { flex: 0 0 110px; }
  .carregar { text-align: center; color: var(--fraco); padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>

<div class="topo">
  <div>
    <div class="data" id="data"></div>
    <div class="mono" style="font-size:10px;letter-spacing:.06em;color:var(--fraco);margin-top:1px" id="semana"></div>
  </div>
  <button class="redondo toque" id="btn-tema"></button>
</div>

<div id="msg" class="aviso oculto"></div>

<div id="conteudo" class="oculto">

  <section class="vidro cartao-topo">
    <div>
      <div class="etiqueta">RESTAM</div>
      <div class="num restam" id="restam">—</div>
    </div>
    <div class="resumo">
      <span>Comido</span><span class="num" id="comido">—</span>
      <span>Objetivo</span><span class="num" id="objetivo">—</span>
      <span>Défice da semana</span><span class="num" id="defice">—</span>
    </div>
  </section>

  <section class="vidro-leve grafico">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;min-height:16px;gap:10px">
      <span class="etiqueta" id="titulo-grafico">ÚLTIMOS 7 DIAS</span>
      <span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fraco)" id="legenda-objetivo"></span>
    </div>
    <div class="barras" id="barras"></div>
    <div class="dias" id="dias"></div>
  </section>

  <section class="vidro refeicoes">
    <div class="lista" id="refeicoes"></div>
  </section>

  <nav class="vidro nav">
    <a href="hoje.html" aria-current="page">Hoje</a>
    <a href="perfil.html">Perfil</a>
  </nav>

</div>

<div class="carregar" id="carregar">A carregar…</div>

<!-- folha de registo -->
<button class="veu oculto" id="veu" aria-label="Fechar"></button>
<div class="folha oculto" id="folha" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
  <div class="puxador"></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline">
    <h2 id="folha-titulo" style="font-size:18px;font-weight:600;margin:0"></h2>
    <button class="toque" id="fechar" style="font-size:14px;color:var(--fraco)">Fechar</button>
  </div>
  <p id="folha-sub" style="font-size:12px;color:var(--fraco);margin:3px 0 14px"></p>

  <ul class="itens" id="itens"></ul>

  <form id="form-item" autocomplete="off">
    <div class="dupla">
      <div>
        <label for="descricao">O que comeste</label>
        <input type="text" id="descricao" maxlength="80" placeholder="Massa com atum">
      </div>
      <div>
        <label for="kcal">kcal</label>
        <input type="number" id="kcal" min="0" max="5000" step="1" inputmode="numeric" required>
      </div>
    </div>
    <button type="submit" class="principal toque" id="guardar">Acrescentar</button>
  </form>

  <button class="toque" id="nao-comi" style="width:100%;margin-top:10px;padding:13px;border-radius:16px;border:1px solid var(--vidro-borda-leve);background:var(--campo);font-size:14px;color:var(--fraco)">Não comi esta refeição</button>
</div>

<script type="module">
import { exigirSessao, textoErro } from './sessao.js';
import { alternarTema, desenharIconeTema, aplicarTema } from './tema.js';

const $ = (id) => document.getElementById(id);
const PRINCIPAIS = ['pequeno_almoco', 'almoco', 'jantar'];
const NOMES = {
  pequeno_almoco: 'Pequeno-almoço',
  almoco: 'Almoço',
  jantar: 'Jantar',
  lanche: 'Lanches',
};

let supabase, perfil, eu;
let objetivo = null;         // kcal/dia, vindo de estimar_gasto
let registos = [];           // registos de hoje
let semana = [];             // [{data, kcal, completo}]
let diaSelecionado = null;
let refeicaoAberta = null;

const hojeISO = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Lisbon' });

function numero(n) {
  return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function aviso(texto, tipo) {
  const m = $('msg');
  m.textContent = texto || '';
  m.className = 'aviso ' + (tipo || '');
  m.classList.toggle('oculto', !texto);
  if (texto) window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---------------------------------------------------------------- dados
async function carregar() {
  const [r1, r2, r3] = await Promise.all([
    supabase.from('registos').select('*').eq('data', hojeISO()).order('criado_em'),
    supabase.rpc('ultimos_dias', { p_dias: 7 }),
    supabase.rpc('estimar_gasto'),
  ]);
  if (r1.error) throw r1.error;
  if (r2.error) throw r2.error;
  registos = r1.data || [];
  semana = r2.data || [];
  const g = Array.isArray(r3.data) ? r3.data[0] : r3.data;
  objetivo = (g && g.kcal_objetivo) ? g.kcal_objetivo : null;
  desenhar();
}

const totalDe = (ref) => registos.filter(r => r.refeicao === ref).reduce((s, r) => s + r.kcal, 0);
const saltada = (ref) => registos.some(r => r.refeicao === ref && r.nao_comi);
const itensDe = (ref) => registos.filter(r => r.refeicao === ref && !r.nao_comi);
const comidoHoje = () => registos.reduce((s, r) => s + r.kcal, 0);

// ---------------------------------------------------------------- ecrã
function desenhar() {
  const agora = new Date();
  $('data').textContent = agora.toLocaleDateString('pt-PT', {
    timeZone: 'Europe/Lisbon', weekday: 'long', day: 'numeric', month: 'short',
  }).replace(/^./, c => c.toUpperCase());

  const comido = comidoHoje();
  $('comido').textContent = numero(comido);

  if (objetivo) {
    $('objetivo').textContent = numero(objetivo);
    const restam = objetivo - comido;
    $('restam').textContent = numero(Math.abs(restam));
    $('restam').style.color = restam < 0 ? 'var(--barra-alta-texto)' : 'var(--texto)';
    $('restam').previousElementSibling.textContent = restam < 0 ? 'A MAIS' : 'RESTAM';
    $('legenda-objetivo').innerHTML =
      '<span style="width:16px;border-top:1px dashed var(--texto)"></span>objetivo ' + numero(objetivo);
  } else {
    $('objetivo').textContent = '—';
    $('restam').textContent = '—';
    $('legenda-objetivo').textContent = '';
  }

  // défice da semana precisa do gasto, não do objetivo; sem perfil fica vazio
  const somaSemana = semana.reduce((s, d) => s + d.kcal, 0);
  $('defice').textContent = objetivo ? '−' + numero(Math.max(0, objetivo * 7 - somaSemana)) : '—';

  desenharGrafico();
  desenharRefeicoes();

  $('carregar').classList.add('oculto');
  $('conteudo').classList.remove('oculto');
}

function desenharGrafico() {
  const barras = $('barras');
  const dias = $('dias');
  barras.replaceChildren();
  dias.replaceChildren();

  const valores = semana.map(d => d.kcal);
  const teto = Math.max(objetivo || 0, ...valores, 1) * 1.08;
  const escala = 84 / teto;

  const linha = document.createElement('div');
  linha.className = 'linha-objetivo';
  linha.style.bottom = objetivo ? Math.round(objetivo * escala) + 'px' : '-100px';
  barras.append(linha);

  semana.forEach((d, i) => {
    const eHoje = d.data === hojeISO();
    const acima = objetivo && d.kcal > objetivo;
    const vazio = d.kcal === 0;

    const b = document.createElement('button');
    b.className = 'toque';
    b.setAttribute('aria-label', rotuloDia(d) + ', ' + numero(d.kcal) + ' kcal');
    b.addEventListener('click', () => {
      diaSelecionado = diaSelecionado === i ? null : i;
      desenharGrafico();
      tituloGrafico();
    });

    const v = document.createElement('span');
    v.className = 'valor';
    v.textContent = vazio ? '' : numero(d.kcal);
    if (acima) v.style.color = 'var(--barra-alta-texto)';
    if (eHoje) v.style.color = 'var(--texto)';

    const h = document.createElement('span');
    h.className = 'haste';
    h.style.height = Math.max(3, Math.round(d.kcal * escala)) + 'px';
    if (acima) h.style.background = 'var(--barra-alta)';
    // hoje ainda não acabou: fica tracejado até o dia estar completo
    if (eHoje && !d.completo) {
      h.style.background = 'var(--hoje-fundo)';
      h.style.border = 'var(--hoje-contorno)';
    }
    if (diaSelecionado === i) h.style.outline = '2px solid var(--acento)';

    b.append(v, h);
    barras.append(b);

    const s = document.createElement('span');
    s.textContent = eHoje ? 'hoje' : letraDia(d.data);
    if (diaSelecionado === i || eHoje) s.style.color = 'var(--texto)';
    dias.append(s);
  });
  tituloGrafico();
}

function letraDia(iso) {
  return ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'][new Date(iso + 'T12:00:00').getDay()];
}
function rotuloDia(d) {
  if (d.data === hojeISO()) return 'Hoje';
  return new Date(d.data + 'T12:00:00')
    .toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'short' });
}

function tituloGrafico() {
  const t = $('titulo-grafico');
  if (diaSelecionado === null || !semana[diaSelecionado]) {
    t.textContent = 'ÚLTIMOS 7 DIAS';
    return;
  }
  const d = semana[diaSelecionado];
  let texto = rotuloDia(d).toUpperCase() + ' · ' + numero(d.kcal) + ' KCAL';
  if (objetivo && d.kcal > 0) {
    const dif = d.kcal - objetivo;
    texto += dif > 0 ? ' · +' + numero(dif) + ' ACIMA' : ' · ' + numero(-dif) + ' ABAIXO';
  }
  t.textContent = texto;
}

function desenharRefeicoes() {
  const lista = $('refeicoes');
  lista.replaceChildren();

  [...PRINCIPAIS, 'lanche'].forEach((ref) => {
    const total = totalDe(ref);
    const itens = itensDe(ref);
    const falta = saltada(ref);

    const b = document.createElement('button');
    b.className = 'linha-toque toque' + (falta ? ' saltada' : '');
    b.addEventListener('click', () => abrirFolha(ref));

    const esq = document.createElement('div');
    const nome = document.createElement('div');
    nome.className = 'nome';
    nome.textContent = NOMES[ref];
    esq.append(nome);

    if (falta) {
      const sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = 'Não comi';
      esq.append(sub);
    } else if (itens.length) {
      const sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = itens.map(i => i.descricao || 'sem nome').join(', ');
      esq.append(sub);
    }

    const dir = document.createElement('div');
    if (falta) {
      dir.style.cssText = 'font-size:14px;color:var(--fraco)';
      dir.textContent = '—';
    } else if (itens.length) {
      dir.className = 'num kcal';
      dir.innerHTML = numero(total) + ' <span style="font-family:\'IBM Plex Sans\',sans-serif;font-size:11px;color:var(--fraco)">kcal</span>';
    } else {
      dir.style.cssText = 'font-size:15px;font-weight:500;color:var(--acento);white-space:nowrap';
      dir.textContent = (ref === 'lanche' ? 'Acrescentar' : 'Registar') + ' ›';
    }

    b.append(esq, dir);
    lista.append(b);
  });
}

// ---------------------------------------------------------------- folha
function abrirFolha(ref) {
  refeicaoAberta = ref;
  $('folha-titulo').textContent = NOMES[ref];
  $('folha-sub').textContent = ref === 'lanche'
    ? 'Acrescenta o que comeste entre refeições. Sem drama.'
    : 'Acrescenta cada alimento com as suas calorias.';
  $('nao-comi').classList.toggle('oculto', ref === 'lanche' || saltada(ref));
  $('nao-comi').textContent = 'Não comi esta refeição';
  desenharItens();
  $('veu').classList.remove('oculto');
  $('folha').classList.remove('oculto');
  $('descricao').value = '';
  $('kcal').value = '';
  setTimeout(() => $('descricao').focus(), 120);
}

function fecharFolha() {
  refeicaoAberta = null;
  $('veu').classList.add('oculto');
  $('folha').classList.add('oculto');
}

function desenharItens() {
  const ul = $('itens');
  ul.replaceChildren();
  if (!refeicaoAberta) return;

  if (saltada(refeicaoAberta)) {
    const li = document.createElement('li');
    li.style.color = 'var(--fraco)';
    li.innerHTML = '<span>Marcado como não comido</span>';
    const btn = document.createElement('button');
    btn.className = 'apagar toque';
    btn.textContent = 'Anular';
    btn.addEventListener('click', () => apagar(registos.find(r => r.refeicao === refeicaoAberta && r.nao_comi).id));
    li.append(btn);
    ul.append(li);
    $('form-item').classList.add('oculto');
    return;
  }
  $('form-item').classList.remove('oculto');

  itensDe(refeicaoAberta).forEach((r) => {
    const li = document.createElement('li');
    const esq = document.createElement('span');
    esq.textContent = r.descricao || 'Sem nome';
    const dir = document.createElement('span');
    dir.style.cssText = 'display:flex;align-items:center;gap:10px';
    const k = document.createElement('span');
    k.className = 'num';
    k.style.fontSize = '17px';
    k.textContent = numero(r.kcal);
    const btn = document.createElement('button');
    btn.className = 'apagar toque';
    btn.textContent = 'Apagar';
    btn.setAttribute('aria-label', 'Apagar ' + (r.descricao || 'item'));
    btn.addEventListener('click', () => apagar(r.id));
    dir.append(k, btn);
    li.append(esq, dir);
    ul.append(li);
  });
}

async function acrescentar(ev) {
  ev.preventDefault();
  const btn = $('guardar');
  btn.disabled = true;
  try {
    const kcal = Number($('kcal').value);
    if (!Number.isFinite(kcal) || kcal < 0 || kcal > 5000) {
      throw new Error('As calorias têm de estar entre 0 e 5000.');
    }
    const { error } = await supabase.from('registos').insert({
      utilizador_id: eu,
      data: hojeISO(),
      refeicao: refeicaoAberta,
      descricao: $('descricao').value.trim() || null,
      kcal: Math.round(kcal),
      fonte: 'manual',
    });
    if (error) throw error;
    $('descricao').value = '';
    $('kcal').value = '';
    $('descricao').focus();
    await carregar();
    desenharItens();
  } catch (e) {
    aviso(textoErro(e), 'erro');
  } finally {
    btn.disabled = false;
  }
}

async function marcarNaoComi() {
  const btn = $('nao-comi');
  btn.disabled = true;
  try {
    if (itensDe(refeicaoAberta).length) {
      throw new Error('Esta refeição já tem alimentos. Apaga-os primeiro.');
    }
    const { error } = await supabase.from('registos').insert({
      utilizador_id: eu,
      data: hojeISO(),
      refeicao: refeicaoAberta,
      kcal: 0,
      nao_comi: true,
    });
    if (error) throw error;
    await carregar();
    desenharItens();
    $('nao-comi').classList.add('oculto');
  } catch (e) {
    aviso(textoErro(e), 'erro');
  } finally {
    btn.disabled = false;
  }
}

async function apagar(id) {
  try {
    const { error } = await supabase.from('registos').delete().eq('id', id);
    if (error) throw error;
    await carregar();
    if (refeicaoAberta) {
      $('nao-comi').classList.toggle('oculto', refeicaoAberta === 'lanche' || saltada(refeicaoAberta));
      desenharItens();
    }
  } catch (e) {
    aviso(textoErro(e), 'erro');
  }
}

// ---------------------------------------------------------------- arranque
async function principal() {
  const ctx = await exigirSessao();
  supabase = ctx.supabase;
  perfil = ctx.perfil;
  eu = ctx.sessao.user.id;

  const n = new Date();
  const inicio = new Date(n.getFullYear(), 0, 1);
  $('semana').textContent = 'SEMANA ' + Math.ceil((((n - inicio) / 86400000) + inicio.getDay() + 1) / 7);

  desenharIconeTema($('btn-tema'));
  $('btn-tema').addEventListener('click', () => {
    alternarTema();
    desenharIconeTema($('btn-tema'));
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    aplicarTema();
    desenharIconeTema($('btn-tema'));
  });

  $('veu').addEventListener('click', fecharFolha);
  $('fechar').addEventListener('click', fecharFolha);
  $('form-item').addEventListener('submit', acrescentar);
  $('nao-comi').addEventListener('click', marcarNaoComi);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharFolha(); });

  await carregar();

  if (!objetivo) {
    aviso('Falta o teu perfil para calcular o objetivo diário. Os registos funcionam na mesma.', 'bom');
  }
}

principal().catch((e) => {
  $('carregar').textContent = '';
  aviso(textoErro(e), 'erro');
});
</script>
</body>
</html>
